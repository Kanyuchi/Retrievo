<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: Fraunces (display), Public Sans (body), IBM Plex Mono (citation chips) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Humbowo — Chat with your documents, with the proof</title>
    <meta name="description" content="Humbowo is an EU-hosted knowledge platform: upload your documents and get answers with citations you can trust. Team workspaces, knowledge graph, and cited chat over your own library. Humbowo is Shona for evidence." />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E3A3A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Humbowo" />
    <meta property="og:title" content="Humbowo — Chat with your documents, with the proof" />
    <meta property="og:description" content="EU-hosted knowledge platform. Upload documents, get cited answers, share team workspaces. Every answer carries its source." />
    <meta property="og:url" content="https://humbowo.com/" />
    <meta property="og:image" content="https://humbowo.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Humbowo — Chat with your documents, with the proof" />
    <meta name="twitter:description" content="EU-hosted knowledge platform. Upload documents, get cited answers, share team workspaces." />
    <meta name="twitter:image" content="https://humbowo.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
